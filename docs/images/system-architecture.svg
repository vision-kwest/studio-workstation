<title id="title">Studio Workstation architecture</title><desc id="desc">GitHub source feeds versioned S3 releases and Image Builder, producing CPU and GPU AMIs deployed through CloudFormation to EC2 workstations, accessed through Amazon DCV with SSM for administration.</desc>
