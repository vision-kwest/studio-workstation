name: Rez OpenUSD EFS preflight (offline)
on:
  pull_request:
    paths:
      - 'scripts/rez_openusd_preflight.py'
      - 'runtime/standalone_efs.py'
      - 'scripts/install_workstation_rez.py'
      - 'scripts/check_openusd_rez.py'
      - 'tests/test_openusd_rez_smoke.py'
      - 'fixtures/openusd/hello.usda'
      - 'tests/test_workstation_rez_setup.py'
      - 'docs/rez-workstation-setup.md'
      - 'tests/test_standalone_efs.py'
      - 'tests/test_rez_openusd_preflight.py'
      - 'docs/rez-openusd-res-efs-audit.md'
      - '.github/workflows/rez-openusd-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only preflight
        run: python3 -m py_compile scripts/rez_openusd_preflight.py runtime/standalone_efs.py scripts/install_workstation_rez.py scripts/check_openusd_rez.py
      - name: Run synthetic EFS and Rez/OpenUSD contract tests (no AWS)
        run: python3 -m unittest discover -s tests -p 'test_rez_openusd_preflight.py' -v
      - name: Test standalone EFS mount adapter offline (no real mounts)
        run: python3 -m unittest discover -s tests -p 'test_standalone_efs.py' -v
      - name: Test pinned CPU Rez production installer without network or AWS
        run: python3 -m unittest discover -s tests -p 'test_workstation_rez_setup.py' -v
      - name: Test production OpenUSD Rez tools and native ABI with mocked commands
        run: python3 -m unittest discover -s tests -p 'test_openusd_rez_smoke.py' -v
