name: Issue 98 external DCV reachability
on:
  push:
    branches: [feature/issue98-unified-lifecycle]
    paths: [.github/workflows/issue98-live-endpoint.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify public raw-IP DCV endpoint without credentials
        run: |
          python3 - <<'PY'
          import http.client, ssl
          # Exact disposable diagnostic EC2 address, independently verified in AWS.
          # Raw-IP certificate mismatch is accepted; transport/HTTP failure is not.
          client=http.client.HTTPSConnection('3.235.44.161',8443,timeout=10,context=ssl._create_unverified_context())
          try:
              client.request('GET','/')
              response=client.getresponse()
              body=response.read(1048576)
              print('HTTP',response.status,'TYPE',response.getheader('Content-Type'),'BYTES',len(body))
              assert response.status==200
              assert 'text/html' in response.getheader('Content-Type','').lower()
              assert body and b'dcv' in body.lower()
              print('EXTERNAL_DCV_LOGIN_PAGE_REACHABLE; no authentication attempted')
          finally:
              client.close()
          PY
