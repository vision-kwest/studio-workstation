name: RES standalone behavioral and reboot contract
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/test_standalone_behavior.py'
      - 'tests/run_standalone_behavior.py'
      - 'tests/test_res_reboot_contract.py'
      - '.github/workflows/res-standalone-behavior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify original RES archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/res-input /tmp/res-output
          curl -fLsS --retry 2 --max-time 120 \
            https://research-engineering-studio-us-east-1.s3.us-east-1.amazonaws.com/releases/2026.06/res-installation-scripts.tar.gz \
            -o /tmp/res-input/installation-scripts.tar.gz
          curl -fLsS --retry 2 --max-time 120 \
            https://research-engineering-studio-us-east-1.s3.us-east-1.amazonaws.com/releases/2026.06/idea-virtual-desktop-2026.06.tar.gz \
            -o /tmp/res-input/virtual-desktop.tar.gz
          echo '2e3b0e4b198582ea03b1926aaaf76da21688f2e6809ad4d153b95a9417c72658  /tmp/res-input/installation-scripts.tar.gz' | sha256sum -c -
          echo 'f5d2297537bda746fe74411c18140bcd0f2d4322852fa9d32ce7606a93aed7a8  /tmp/res-input/virtual-desktop.tar.gz' | sha256sum -c -
      - name: Check original reboot stages and create modified archive
        run: |
          python3 tests/test_res_reboot_contract.py /tmp/res-input
          python3 runtime/build_res_overlay.py --input /tmp/res-input/virtual-desktop.tar.gz --output /tmp/res-output/virtual-desktop-derived.tar.gz
          tar -xOzf /tmp/res-input/virtual-desktop.tar.gz ./requirements.txt > /tmp/res-output/requirements.txt
          cp tests/test_standalone_behavior.py tests/run_standalone_behavior.py /tmp/res-output/
          cat > /tmp/res-output/Dockerfile <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /audit
          COPY requirements.txt .
          RUN python -m pip install --no-cache-dir -r requirements.txt
          COPY test_standalone_behavior.py run_standalone_behavior.py ./
          USER 65534:65534
          ENTRYPOINT ["python", "-B", "/audit/run_standalone_behavior.py"]
          DOCKERFILE
      - name: Prepare disposable Python dependency environment
        run: docker build --pull -t res-standalone-behavior:ci /tmp/res-output
      - name: Mock original bootstrap without network, credentials or host access
        run: |
          chmod 777 /tmp/res-output
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=128m --memory 2g --pids-limit 64 \
            --user 65534:65534 \
            --mount type=bind,src=/tmp/res-output/virtual-desktop-derived.tar.gz,dst=/audit/app.tar.gz,readonly \
            --mount type=bind,src=/tmp/res-output,dst=/audit/reports \
            res-standalone-behavior:ci \
            /audit/app.tar.gz /audit/test_standalone_behavior.py /audit/reports/standalone-behavior.json
      - name: Task 6 coordinator Python syntax and mocked tests (review-only)
        run: |
          python3 -m py_compile runtime/studio_res_runtime.py tests/test_studio_res_runtime.py
          python3 -m unittest discover -s tests -p 'test_studio_res_runtime.py' -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-behavior
          path: /tmp/res-output/standalone-behavior.json
          if-no-files-found: warn
