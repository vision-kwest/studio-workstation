name: Issue98 bounded readiness correction
on:
  push:
    branches: [feature/issue98-unified-lifecycle]
    paths: [.github/workflows/issue98-bounded-wait-publish.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply only the reviewed CLI delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('scripts/studio_workstation_cli.py')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(p.read_bytes()) == '5952e7189b56a42f1e4dc162baa6cf265384c032'
          s = p.read_text()
          s = s.replace('def wait_gpu_bootstrap(stack, region, *, attempts=48,', 'def wait_gpu_bootstrap(stack, region, *, attempts=96,')
          s = s.replace('Allow up to ~12 minutes for RES reboots, retaining fail-closed readiness.', 'Bound retries across native RES installation and reboots; keep fail-closed readiness.')
          s = s.replace('("GPU readiness failed", "GPU readiness timed out")):\n                raise\n        if attempt + 1', '("GPU readiness failed", "GPU readiness timed out")):\n                raise\n            failure = str(exc)\n        if attempt + 1')
          s = s.replace('raise RuntimeError("GPU RES/DCV bootstrap did not become ready; "\n                       "native workstation expiry remains armed")', 'raise RuntimeError("RES/DCV bootstrap did not become ready; "\n                       "native workstation expiry remains armed; last check: " + failure)')
          assert blob(s.encode()) == '3327f2a67049d3a6082b9e7b6ea350c4a11aae14'
          p.write_text(s)
          PY
      - name: Run exact-tree regression tests
        run: |
          python3 -m pip install -q -r requirements.txt pytest pytest-subtests
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q \
            --ignore=tests/test_standalone_behavior.py \
            --deselect=tests/test_efs_client_install.py::EfsClientInstallTests::test_success \
            --deselect=tests/test_gpu_dcv_gl_selection.py::TestDcvSelection::test_preserves_cpu_dcv_logic
          git diff --check
          git diff --numstat
      - name: Publish source only; no force push or workflow mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/studio_workstation_cli.py
          git commit -m 'fix(issue98): allow bounded native RES provisioning and preserve timeout diagnostics'
          git push origin HEAD:refs/heads/feature/issue98-unified-lifecycle
          git rev-parse HEAD HEAD^{tree}
