name: Apply tested issue 98 endpoint patch
on:
  push:
    branches: [feature/issue98-dcv-endpoints]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/issue98-dcv-endpoints'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact locally tested patch
        run: |
          echo '1a6b433a580ac7c54074b1d4d803d142b18b16694758bcbaea7c621b092e9daf  .issue98.patch.gz' | sha256sum --check
          gzip --decompress --stdout .issue98.patch.gz > /tmp/issue98.patch
          echo '1efb8e109296204aa0383c8be8efcba11004f8ba2c142d2f3e71eed18d12fa0e  /tmp/issue98.patch' | sha256sum --check
          git apply --index --exclude='.github/workflows/*' /tmp/issue98.patch
          git rm .issue98.patch.gz
          git diff --cached --check
      - run: python3 -m pip install 'jinja2>=3,<4'
      - name: Run lifecycle regression suites
        run: |
          for suite in studio_workstation_cli workstation_inventory dcv_endpoint pr65_gpu_create pr65_one_shot_guard independent_eip issue43_cli_lifecycle issue43_hostname_handoff issue43_gpu_acm_setup issue43_destroy issue43_cpu_destroy issue68_expiration_extension issue43_e2e_offline gpu_profile_contract gpu_cli_test_cleanup gpu_cli_guard_infra; do
            python3 -m unittest discover -s tests -p "test_${suite}.py" -v || exit 1
          done
          python3 -m py_compile scripts/studio_workstation_cli.py runtime/workstation_inventory.py runtime/dcv_endpoint.py
      - name: Commit only tested source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(issue98): verify reachable DCV endpoints independently of historical stack names'
          git push origin HEAD:feature/issue98-dcv-endpoints
