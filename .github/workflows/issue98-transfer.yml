name: Issue 98 verified integration transfer
on:
  push:
    branches: [feature/issue98-unified-lifecycle]
    paths: [.github/workflows/issue98-transfer.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact locally tested delta
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          base='1e3efa077f141aabd7adfc936a947f51621873e4'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          parts=[f'.github/issue98-transfer.part{i}.b64' for i in range(4)]
          workflows={'.github/workflows/studio-cli.yml','.github/workflows/issue43-offline.yml'}
          assert changed==set(parts)|workflows|{'.github/workflows/issue98-transfer.yml'}, changed
          encoded=''.join(pathlib.Path(p).read_text() for p in parts)
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='27e64db469b38aefa8c2e72e179c6a0c75b9cc380a1476f3ecb64842c3c657e8'
          bundle=json.loads(lzma.decompress(packed))
          assert bundle['base']==base and len(bundle['files'])==46
          for entry in bundle['files']:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.parts[0] in {'README.md','requirements.txt','studio','runtime','scripts','tests','docs','.github','infra'}
              assert not path.is_symlink()
              old=path.read_bytes() if path.exists() else b''
              digest=hashlib.sha256(old).hexdigest()
              if str(path) in workflows:
                  assert digest==entry['after'], str(path)
                  continue
              assert digest==entry['before'], (str(path),digest,entry['before'])
              if entry['after'] is None:
                  path.unlink()
                  continue
              lines=old.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(entry['ops']):
                  lines[start:end]=replacement
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==entry['after'], str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
          PY
      - run: python3 -m pip install 'jinja2>=3,<4' pytest
      - name: Full available regression with documented baseline exclusions
        run: |
          python3 -m pytest -q --ignore=tests/test_standalone_behavior.py --deselect=tests/test_efs_client_install.py::EfsClientInstallTests::test_success --deselect=tests/test_gpu_dcv_gl_selection.py::TestDcvSelection::test_preserves_cpu_dcv_logic
          git diff --check
          python3 -m compileall -q scripts runtime
      - name: Publish only verified source without workflow-permission expansion
        run: |
          set -euo pipefail
          git rm .github/issue98-transfer.part{0,1,2,3}.b64
          git add -A
          git rm --cached .github/workflows/issue98-transfer.yml
          test "$(git write-tree)" = '1c75db4c7c813a7e9b0cea08174feaad002bb352'
          git restore --source=HEAD --staged .github/workflows/issue98-transfer.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git diff --cached --numstat 1e3efa077f141aabd7adfc936a947f51621873e4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#98): unified disposable workstation lifecycle and explicit DCV ownership'
          git push origin HEAD:feature/issue98-unified-lifecycle
