name: VS Code package
on:
  pull_request:
    paths:
      - 'software/vscode/**'
      - 'runtime/publisher.py'
      - 'tests/test_vscode_package.py'
      - 'tests/test_publisher.py'
      - '.github/workflows/vscode-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vision-kwest/studio-rez
          ref: 2fee37e32a09c337d9486e00bcc2a16c3ff4b0fb
          path: .test-deps/studio-rez
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rez==3.4.0' 'pytest>=8,<10' 'jinja2>=3,<4'
      - run: python -m pytest -q tests/test_vscode_package.py tests/test_publisher.py
        env:
          STUDIO_REZ_TEST_ROOT: ${{ github.workspace }}/.test-deps/studio-rez
