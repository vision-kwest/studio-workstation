name: Persist verified Image Builder 0.1.11 definitions
on:
  push:
    branches:
      - feature/res-2026-06-standalone-runtime
    paths:
      - '.github/workflows/imagebuilder-0111-persist-reviewed.yml'
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2' 'PyYAML>=6,<7'
      - name: Generate and verify exact reviewed files
        run: |
          python scripts/prepare_imagebuilder_0111_review.py \
            --snapshot review/imagebuilder-0.1.11/source-snapshot.json \
            --output-dir review/imagebuilder-0.1.11/definitions
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, yaml, json
          root=Path('review/imagebuilder-0.1.11/definitions')
          expected={
            'studio-gpu-nvidia-res-stage-0.1.7.yaml':'9d49616b97da4a81c9b9f365c547159a0625a9e5fdcd2e3256bdafc1eb8ce02f',
            'studio-gpu-dcv-res-stage-0.1.4.yaml':'329f635c607efbbf3439e6a54b625b97d64830dc9e9ea816c53bcaedf9d70e8a',
            'studio-gpu-dcv-smoke-test-res-0.1.2.yaml':'7885873e7c68841b24a33616aa6b5487b2a5eccfde66d54c424ac932566e09df',
            'image-recipe-0.1.11.json':'2c86dcf55a9ceae8305263719d1b2fd47fced85bb180ad4d0ccb53259008116d',
            'source-manifest.json':'8155a3b3e4277c5740769de957fa431de5678881f67f972abc3ff5f05c06cc2d',
          }
          for name,digest in expected.items():
            p=root/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, name
            if name.endswith('.yaml'):
              doc=yaml.safe_load(p.read_text())
              for phase in doc['phases']:
                for step in phase['steps']:
                  if step['action']=='ExecuteBash':
                    for cmd in step['inputs']['commands']:
                      subprocess.run(['bash','-n'],input=cmd,text=True,check=True)
          assert json.loads((root/'image-recipe-0.1.11.json').read_text())['semanticVersion']=='0.1.11'
          print('Verified exact five files against reviewed artifact SHA256 and Bash syntax')
          PY
      - name: Commit reviewed definitions to PR feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/imagebuilder-0.1.11/definitions
          git diff --cached --quiet || { git commit -m 'chore(review): persist exact hash-verified 0.1.11 component definitions'; git push origin HEAD:feature/res-2026-06-standalone-runtime; }
