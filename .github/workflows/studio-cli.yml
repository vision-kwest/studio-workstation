name: Studio CLI tests
on:
  push:
    branches:
      - feature/issue-46-gpu-cli
  pull_request:
    paths:
      - 'studio'
      - 'scripts/studio_workstation_cli.py'
      - 'infra/workstation-expiration-role.json'
      - 'runtime/workstation_inventory.py'
      - 'runtime/pr65_gpu_create.py'
      - 'runtime/pr65_one_shot_guard.py'
      - 'runtime/publisher.py'
      - 'tests/test_publisher.py'
      - 'tests/workstation_fake.py'
      - 'tests/test_issue84_gpu_bootstrap_wait.py'
      - 'tests/test_issue88_hostname_plan.py'
      - 'runtime/dcv_endpoint.py'
      - 'tests/test_dcv_endpoint.py'
      - 'tests/test_workstation_inventory.py'
      - 'runtime/render_workstation.py'
      - 'tests/test_gpu_profile_contract.py'
      - 'tests/test_studio_workstation_cli.py'
      - '.github/workflows/studio-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'jinja2>=3,<4' pytest
      - run: python3 -m unittest discover -s tests -p test_studio_workstation_cli.py -v
      - run: python3 -m unittest discover -s tests -p test_workstation_inventory.py -v
      - run: python3 -m unittest discover -s tests -p test_dcv_endpoint.py -v
      - run: python3 -m unittest discover -s tests -p test_studio_software_offline.py -v
      - run: python3 -m unittest discover -s tests -p test_gpu_profile_contract.py -v
      - run: python3 -m unittest discover -s tests -p test_pr65_one_shot_guard.py -v
      - run: python3 -m unittest discover -s tests -p test_pr65_gpu_create.py -v
      - name: Render exact scoped GPU template (offline)
        run: |
          python3 runtime/render_workstation.py --profile gpu --lifecycle persistent --bucket studio-workstation-releases-401233741942-us-east-1 --prefix releases/issue100-res-native-20261115/res-2026.06 --user workstation --output /tmp/scoped-gpu-template.json
          python3 -m json.tool /tmp/scoped-gpu-template.json >/dev/null
          python3 - <<'PY'
          import json
          t=json.load(open('/tmp/scoped-gpu-template.json'))
          data=t['Resources']['Workstation']['Properties']['UserData']['Fn::Base64']['Fn::Sub']
          assert 'releases/issue100-res-native-20261115/res-2026.06/installation-scripts.tar.gz' in data
          assert 'releases/task7-pr61-postreboot-a8ec326/res-2026.06/virtual-desktop.tar.gz' in data
          assert 'sgj5wZfqMTRUImWDDbxR08emK755aU7A' in data
          assert '6d3187049ecee202167cc462492431e3cb9a2a22d78300a8189db3fa2924ee7d' in data
          PY
      - run: python3 -m unittest discover -s tests -p test_issue84_gpu_bootstrap_wait.py -v
      - run: python3 -m unittest discover -s tests -p test_issue88_hostname_plan.py -v
      - run: python3 -m py_compile scripts/studio_workstation_cli.py runtime/render_workstation.py
      - run: python3 -m pytest -q tests/test_publisher.py
      - run: python3 studio workstation --help
