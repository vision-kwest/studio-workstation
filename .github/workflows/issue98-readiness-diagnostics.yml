name: Issue 98 readiness diagnostic patch
on:
  push:
    branches: [feature/issue98-unified-lifecycle]
    paths: [.github/workflows/issue98-readiness-diagnostics.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact two-file diagnostic delta
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          base='b99bc805bc3ba899e8852843cfc1da848efa9850'
          workflow='.github/workflows/issue98-readiness-diagnostics.yml'
          patch='.github/issue98-readiness.patch'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed=={workflow,patch}, changed
          content=pathlib.Path(patch).read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(content).hexdigest()=='e9c3dfbac7a16efaab0d444c0a9d12e11f17ada85f3fd6f7fa6d8e9359a8208a'
          subprocess.run(['git','apply','--check','-'],input=content,check=True)
          subprocess.run(['git','apply','-'],input=content,check=True)
          subprocess.run(['git','rm',patch],check=True)
          subprocess.run(['git','add','scripts/studio_workstation_cli.py','tests/test_studio_workstation_cli.py'],check=True)
          subprocess.run(['git','rm','--cached',workflow],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='6f4911fdbce54f28b0e1efa6b0cab35556ca5148', tree
          subprocess.run(['git','restore','--source=HEAD','--staged',workflow],check=True)
          PY
      - run: python3 -m pip install 'jinja2>=3,<4' pytest
      - name: Verify regressions
        run: |
          python3 -m pytest -q --ignore=tests/test_standalone_behavior.py --deselect=tests/test_efs_client_install.py::EfsClientInstallTests::test_success --deselect=tests/test_gpu_dcv_gl_selection.py::TestDcvSelection::test_preserves_cpu_dcv_logic
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Publish verified diagnostic source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(#98): preserve native readiness failure details and SSM identity'
          git push origin HEAD:feature/issue98-unified-lifecycle
