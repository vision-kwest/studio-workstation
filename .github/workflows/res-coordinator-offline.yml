name: Task 6 RES coordinator offline checks
on:
  pull_request:
    paths:
      - 'runtime/studio_res_runtime.py'
      - 'runtime/studio-res-runtime.service'
      - 'tests/test_studio_res_runtime.py'
      - '.github/workflows/res-coordinator-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and mocked tests
        run: |
          set -euo pipefail
          python3 -m py_compile runtime/studio_res_runtime.py tests/test_studio_res_runtime.py
          python3 -m unittest discover -s tests -p 'test_studio_res_runtime.py' -v
      - name: Systemd unit syntax (no service startup)
        run: systemd-analyze verify runtime/studio-res-runtime.service
