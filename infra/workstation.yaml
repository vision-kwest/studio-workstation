AWSTemplateFormatVersion: '2010-09-09'
Description: 'Minimal single EC2 workstation foundation; bring your own tested DCV AMI'
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Validated workstation AMI with desktop, DCV, SSM, and appropriate GPU drivers
  InstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues: [g4dn.xlarge, g5.xlarge, m7i.large, m7i.xlarge]
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ClientCidr:
    Type: String
    Description: Your current public IPv4 address followed by /32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
  DiskSizeGiB:
    Type: Number
    Default: 100
    MinValue: 40
    MaxValue: 2048
Resources:
  WorkstationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DCV access from one trusted CIDR only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref ClientCidr
        - IpProtocol: udp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref ClientCidr
  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  WorkstationProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkstationRole]
  Workstation:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WorkstationSG]
      IamInstanceProfile: !Ref WorkstationProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskSizeGiB
            VolumeType: gp3
            DeleteOnTermination: false
            Encrypted: true
      Tags:
        - Key: Name
          Value: studio-workstation
Outputs:
  InstanceId:
    Value: !Ref Workstation
  Note:
    Value: Start/stop through EC2 console or workstation CLI; no SSH port is opened
