AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Experimental single Ubuntu 24.04 CPU workstation with RES-derived local
  reboot-resumable GNOME/Xorg/DCV provisioning; no control host or SSH.
Parameters:
  BaseAmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0fc0d6e8d70ab2d42
    Description: Canonical Ubuntu 24.04 x86_64 in us-east-1; verify owner 099720109477.
  InstanceType:
    Type: String
    Default: m7i.xlarge
    AllowedValues: [m7i.large, m7i.xlarge, m7i.2xlarge]
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with outbound internet access; must belong to selected VPC.
  ClientCidr:
    Type: String
    Description: Trusted client public IPv4 /32 for DCV; never use 0.0.0.0/0.
    AllowedPattern: '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
  DiskSizeGiB:
    Type: Number
    Default: 80
    MinValue: 50
    MaxValue: 1024
Resources:
  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  WorkstationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WorkstationRole
  WorkstationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Studio DCV TCP and UDP 8443 from one trusted CIDR only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref ClientCidr
        - IpProtocol: udp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref ClientCidr
  Workstation:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref BaseAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WorkstationInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref WorkstationSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref DiskSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: studio-workstation-cpu-runtime
        - Key: Project
          Value: studio-workstation
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p /usr/local/sbin /var/lib/studio-workstation /var/log/studio-workstation
          cat > /usr/local/sbin/studio-workstation-bootstrap <<'STUDIO_BOOTSTRAP_SCRIPT'
          #!/usr/bin/env bash
          # Studio Workstation runtime bootstrap. Executed locally by systemd, not by SSM.
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          STATE=/var/lib/studio-workstation
          mkdir -p "$STATE" /var/log/studio-workstation
          exec >>/var/log/studio-workstation/bootstrap.log 2>&1
          echo "=== $(date -Is) stage $(cat "$STATE/stage" 2>/dev/null || echo 0) ==="
          trap 'code=$?; echo "ERROR $(date -Is) stage $(cat "$STATE/stage" 2>/dev/null || echo 0) exit $code"; exit "$code"' ERR
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          
          # No SSH, no remote execution dependency. APT transactions are bounded.
          apt_refresh() {
            timeout --signal=TERM --kill-after=60s 15m apt-get update -o Acquire::Retries=3
          }
          apt_install() {
            timeout --signal=TERM --kill-after=60s 45m apt-get install -y -o Acquire::Retries=3 "$@"
          }
          # A core-system package transition coincided with prior guest reachability failures.
          # Do not assume it was the root cause. Fail safely rather than silently risk it.
          check_core_upgrade() {
            local plan="$STATE/apt-plan-$(cat "$STATE/stage").txt"
            apt-get -s install "$@" | tee "$plan"
            if grep -Eq '^Inst (systemd|libsystemd0|systemd-sysv|udev|libudev1) ' "$plan"; then
              echo 'CORE_OS_UPGRADE_REQUIRED: choose a refreshed Canonical Ubuntu 24.04 AMI before continuing.'
              exit 40
            fi
          }
          advance_reboot() {
            printf '%s\n' "$1" > "$STATE/stage"
            sync
            echo "Stage complete. Scheduling reboot for next stage $1."
            shutdown -r +1 "Studio Workstation bootstrap stage transition"
          }
          stage=$(cat "$STATE/stage" 2>/dev/null || echo 0)
          case "$stage" in
            0)
              echo "Stage 0: install GDM first"
              apt_refresh
              check_core_upgrade gdm3
              apt_install gdm3
              dpkg --audit
              mkdir -p /etc/gdm3
              if ! grep -q '^\[daemon\]' /etc/gdm3/custom.conf; then
                printf '\n[daemon]\n' >> /etc/gdm3/custom.conf
              fi
              sed -i '/^WaylandEnable=/d' /etc/gdm3/custom.conf
              sed -i '/^\[daemon\]/a WaylandEnable=false' /etc/gdm3/custom.conf
              advance_reboot 1
              ;;
            1)
              echo "Stage 1: install RES-aligned Ubuntu desktop and CPU dummy Xorg"
              apt_refresh
              check_core_upgrade ubuntu-desktop xserver-xorg-video-dummy
              apt_install ubuntu-desktop xserver-xorg-video-dummy
              dpkg --audit
              cat > /etc/X11/xorg.conf <<'XORG'
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              Option "UseEDID" "false"
              VideoRam 512000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0 - 1000.0
              VertRefresh 5.0 - 200.0
              Option "ReducedBlanking"
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Viewport 0 0
                  Depth 24
                  Virtual 4096 2160
              EndSubSection
          EndSection
          XORG
              if ! id workstation >/dev/null 2>&1; then
                useradd -m -s /bin/bash workstation
              fi
              passwd -l workstation || true
              systemctl set-default graphical.target
              systemctl enable gdm3
              advance_reboot 2
              ;;
            2)
              echo "Stage 2: install verified Amazon DCV packages"
              apt_refresh
              workdir=$(mktemp -d)
              trap 'rm -rf "$workdir"' EXIT
              cd "$workdir"
              base=https://d1uj6qtbmh3dt5.cloudfront.net
              curl -fLsS --retry 3 "$base/nice-dcv-ubuntu2404-x86_64.tgz" -o dcv.tgz
              curl -fLsS --retry 3 "$base/nice-dcv-ubuntu2404-x86_64.tgz.sha256sum" -o checksum
              expected=$(awk '{print $1}' checksum)
              [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
              printf '%s  dcv.tgz\n' "$expected" | sha256sum -c -
              mkdir packages
              tar -xzf dcv.tgz -C packages --strip-components=1
              shopt -s nullglob
              server=(packages/nice-dcv-server_*_amd64.ubuntu2404.deb)
              viewer=(packages/nice-dcv-web-viewer_*_amd64.ubuntu2404.deb)
              xdcv=(packages/nice-xdcv_*_amd64.ubuntu2404.deb)
              test "${#server[@]}" -eq 1
              test "${#viewer[@]}" -eq 1
              test "${#xdcv[@]}" -eq 1
              apt_install "./${server[0]}" "./${viewer[0]}" "./${xdcv[0]}"
              usermod -aG video dcv
              mkdir -p /etc/dcv /etc/X11/xorg.conf.d
              cat > /etc/X11/xorg.conf.d/99-disable-dpms.conf <<'DPMS'
          Section "Extensions"
              Option "DPMS" "Disable"
          EndSection
          DPMS
              # Standalone Linux authentication, not RES externalAuth/broker.
              cat >> /etc/dcv/dcv.conf <<'DCV'
          
          [security]
          authentication="system"
          
          [session-management]
          create-session=true
          
          [session-management/automatic-console-session]
          owner="workstation"
          DCV
              systemctl enable dcvserver
              rm -rf "$workdir"
              trap - EXIT
              advance_reboot 3
              ;;
            3)
              echo "Stage 3: validate after reboot"
              systemctl is-active gdm3
              systemctl is-active dcvserver
              for n in $(seq 1 30); do
                if dcv list-sessions 2>/dev/null | grep -q console && pgrep -x Xorg >/dev/null; then
                  break
                fi
                sleep 5
              done
              dcv list-sessions
              dcv list-sessions | grep -q console
              pgrep -a Xorg
              ss -lnt | grep -q ':8443 '
              test "$(passwd -S workstation | awk '{print $2}')" = L
              touch "$STATE/ready"
              echo 'READY: DCV service checks passed; browser login still requires secure password provisioning and manual acceptance test.'
              ;;
            *)
              echo "Unexpected bootstrap stage: $stage" >&2
              exit 2
              ;;
          esac
          STUDIO_BOOTSTRAP_SCRIPT
          chmod 700 /usr/local/sbin/studio-workstation-bootstrap
          cat > /etc/systemd/system/studio-workstation-bootstrap.service <<'STUDIO_SERVICE'
          [Unit]
          Description=Studio Workstation local staged bootstrap
          Wants=network-online.target
          After=network-online.target cloud-final.service
          ConditionPathExists=!/var/lib/studio-workstation/ready
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/studio-workstation-bootstrap
          TimeoutStartSec=3600
          Restart=no
          
          [Install]
          WantedBy=multi-user.target
          STUDIO_SERVICE
          systemctl daemon-reload
          systemctl enable studio-workstation-bootstrap.service
          systemctl start --no-block studio-workstation-bootstrap.service
Outputs:
  InstanceId:
    Value: !Ref Workstation
  InstancePublicIp:
    Value: !GetAtt Workstation.PublicIp
  DcvUrl:
    Value: !Sub 'https://${Workstation.PublicIp}:8443/'
  BootstrapLog:
    Value: /var/log/studio-workstation/bootstrap.log
  ReadyMarker:
    Value: /var/lib/studio-workstation/ready
