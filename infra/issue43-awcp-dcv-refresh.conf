# Issue #43 — Amazon DCV certificate activation sandbox exceptions.
# This systemd drop-in is for aws-workload-credentials-provider-acm.service ONLY.
# AWCP's base service uses ProtectSystem=full; its root-owned refresh hook
# must create the pair under /etc/dcv and chown to dcv:dcv.
# CAP_CHOWN is intentionally the only additional capability. All other
# AWCP sandbox directives, including protection of /usr and /boot, remain.
[Service]
ReadWritePaths=/etc/dcv
CapabilityBoundingSet=CAP_CHOWN
